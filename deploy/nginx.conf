# Proxies everything to the api container (see app.locations).

upstream wam_api { server api:8080; }

server {
    listen 80;
    server_name _;

    # Let certbot answer its challenge before TLS exists.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Once a certificate is issued, uncomment to force HTTPS.
    # location / { return 301 https://$host$request_uri; }

    include /etc/nginx/conf.d/app.locations;
}

